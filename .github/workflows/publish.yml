name: publish

# Publishing is manual and tag-driven. It never runs on a branch push, because
# a published version cannot be taken back: npm unpublish is not a rollback,
# and external capability packs pin what they find here.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Pack and validate without publishing"
        type: boolean
        default: true

permissions:
  contents: read
  # Required for npm provenance: the registry verifies this token against the
  # workflow that produced the tarball.
  id-token: write

jobs:
  # The full release matrix runs first and publishing waits for it. These used
  # to be two independent workflows racing the same tag: v1.1.1 finished
  # publishing at 08:03:43Z while the Ubuntu matrix job was still running until
  # 08:03:48Z and macOS until 08:03:54Z. A macOS-only failure, a runtime audit
  # finding, or a release-identity mismatch would have been reported after the
  # version was already on the registry, where it cannot be withdrawn.
  verify:
    uses: ./.github/workflows/verify.yml
    permissions:
      contents: read

  publish:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.19.0"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Local verification
        run: npm run verify

      - name: Capability catalog is in sync
        run: npm run capabilities:check

      # A tag that disagrees with package.json would publish a version nobody
      # can trace back to a commit.
      - name: Tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag v$tag does not match package.json version $pkg" >&2
            exit 1
          fi

      - name: Pack
        run: npm pack --dry-run

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/') && inputs.dry_run != true
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
