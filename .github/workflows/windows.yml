name: windows

# Piagent on native Windows: personal conversations, the dashboard and the
# guard. Company conversations on Windows run in WSL2 (the Linux sandbox is
# checked by the verify workflow on Ubuntu).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci --ignore-scripts --legacy-peer-deps

      - name: Typecheck
        run: npm run typecheck

      - name: Windows-facing tests
        shell: bash
        env:
          PIAGENT_NO_UPDATE_CHECK: "1"
        run: >-
          node --test --test-force-exit
          tests/policy-core.test.mjs
          tests/piagent-guard-integration.test.mjs
          tests/piagent-webui-path-mentions.test.mjs
          tests/piagent-webui-native-project-picker.test.mjs
          tests/piagent-webui-loopback-server.test.mjs
          tests/piagent-webui-project-registry.test.mjs
          tests/piagent-dashboard-busy-gateway.test.mjs
          tests/update-global.test.mjs
          tests/managed-linux-sandbox.test.mjs
