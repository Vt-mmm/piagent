name: verify

on:
  pull_request:
  push:
    branches:
      - main
  # Tag runs arrive through publish.yml, which calls this workflow and will not
  # publish until it passes. Keeping a separate tag trigger here would run the
  # matrix twice and, worse, make it look like the tag was gated when the
  # publish job was in fact racing it.
  workflow_call:

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.19.0"

      - name: Print runtime platform
        # Block scalar, not a plain one: the command contains ": ", which ends a
        # plain scalar and makes the whole workflow unparseable.
        run: |
          node -p "JSON.stringify({ node: process.version, platform: process.platform, arch: process.arch })"

      - name: Install Linux test tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep

      - name: Install macOS test tools
        if: runner.os == 'macOS'
        run: brew install ripgrep

      - name: Install dependencies
        run: npm ci --ignore-scripts --legacy-peer-deps

      - name: Install pinned Pi host for runtime integration tests
        shell: bash
        run: |
          pi_version="$(node -p "require('./package.json').peerDependencies['@earendil-works/pi-coding-agent']")"
          npm install --global --ignore-scripts "@earendil-works/pi-coding-agent@$pi_version"

      - name: Build WebUI release assets
        run: npm run build --workspace @piagent/webui

      - name: Install WebUI Chromium
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            npx playwright install --with-deps chromium
          else
            npx playwright install chromium
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Run policy regression tests
        run: npm test

      - name: Run local verification
        run: bash scripts/verify-local.sh --offline

      - name: Run redaction benchmark
        run: npm run benchmark:redaction

      - name: Verify release metadata
        run: npm run release:identity

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Pi host and pinned add-on dependency audit
        run: npm run audit:runtime

      - name: Verify release tag and commit identity
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = "tag"
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{}")" = "$RELEASE_COMMIT"
          npm run release:identity -- --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT"
          PIAGENT_EXPECTED_RELEASE_COMMIT="$RELEASE_COMMIT" bash scripts/install-global.sh --stable --dry-run --no-model-scope
